<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a0f06">
<title>Chùa Bình An · Hành hương 3D</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="view"></div>
<div id="labels" aria-hidden="true"></div>
<div id="fade"></div>

<!-- trên cùng -->
<div id="ticker" class="ticker"><span id="tickerText">🙏 A Di Đà Phật · Chào mừng quý Phật tử về chùa</span></div>
<div class="tl">
  <button id="pChip" class="chip-p" aria-label="Hồ sơ tu tập">
    <span id="pInit" class="av">🙏</span>
    <span class="pt"><b id="pName">—</b><small id="pLv"></small><span class="bar"><i id="pBar"></i></span><small id="pBeads"></small></span>
  </button>
  <button id="tName" class="tname">Chùa Bình An</button>
  <small id="tPlace" class="tplace"></small>
  <div id="obj" class="obj"></div>
  <button id="goBtn" class="pill-btn">🗺 Ra sân ngắm cảnh</button>
  <div class="online"><i></i><span id="online">1 đang tu tập</span> · <span id="pq" class="pq">☀️</span></div>
</div>
<nav class="side" aria-label="Chức năng">
  <button id="bPass" title="Sổ hành hương">📜</button>
  <button id="bProf" title="Hồ sơ">👤</button>
  <button id="miniBtn" title="Bản đồ chùa"><canvas id="mini" width="80" height="80"></canvas></button>
  <button id="bStory" title="Nghe truyện">📖</button>
  <button id="bWish" title="Đèn nguyện">🏮</button>
  <button id="setBtn" title="Cài đặt">⚙️</button>
</nav>
<div class="zoom"><button id="zIn" aria-label="Phóng to">+</button><button id="zOut" aria-label="Thu nhỏ">−</button></div>
<div id="banner" class="banner"></div>
<div id="toasts" class="toasts"></div>

<!-- dưới -->
<div id="joy" class="joy" aria-hidden="true"><div id="joyKnob"></div></div>
<div class="keyhint">WASD đi · Shift chạy · kéo chuột xoay · cuộn phóng to · E tương tác · B lạy · T tràng hạt · M bản đồ</div>
<button id="ctx" class="ctx" hidden>Tương tác</button>
<nav id="acts" class="acts" aria-label="Hành động"></nav>

<!-- tràng hạt -->
<div id="malaUI" class="malaui" hidden>
  <button id="malaBack" class="pill-btn back">← Quay lại</button>
  <canvas id="malaCv"></canvas>
  <div class="mcount"><b id="mNum">0</b><span>/ 108</span><small id="mSub">Vòng thứ nhất · tổng 0 chuỗi</small></div>
  <div class="mhint">Chạm hoặc vuốt xuống để lần hạt<br><b>+1 hạt</b> mỗi lần lần</div>
</div>

<!-- tụng kinh -->
<div id="chant" class="chant" hidden>
  <small id="chantTitle"></small><b id="chantLine"></b><span id="chantNext"></span>
  <div class="row"><button id="moBtn" class="mo">🪵 Gõ mõ</button><button id="chantStop" class="btn sm">Dừng tụng</button></div>
</div>
<!-- thiền -->
<div id="med" class="med" hidden><div id="breath" class="breath"></div><b id="medLabel">Hít vào…</b><span id="medTime">00:00</span><button id="medStop" class="btn">Xả thiền</button></div>
<!-- kể chuyện -->
<div id="story" class="story" hidden>
  <div class="shead"><div><small id="sSeries"></small><b id="sTitle"></b></div><span id="sPage"></span><button id="sClose" class="x" aria-label="Đóng">✕</button></div>
  <p id="sText"></p><div id="sOpts" class="opts"></div><button id="sNext" class="btn gold">Trang sau ›</button>
</div>

<div id="veil" class="veil" hidden></div>
<div id="loading" class="loading">Đang thắp đèn chánh điện…</div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/stories.js"></script>
<script src="js/temples.js"></script>
<script src="js/audio.js"></script>
<script type="module" src="js/g3d/main.js"></script>
</body>
</html>
