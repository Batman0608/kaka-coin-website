<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Văn phòng ảo</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <!-- Đăng nhập / đăng ký -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <h1>Văn phòng ảo</h1>
      <p class="muted">Đăng nhập để vào đúng văn phòng của bạn. Mỗi tài khoản là một văn phòng riêng.</p>
      <div class="tabs" id="authTabs">
        <button class="tab active" data-mode="login">Đăng nhập</button>
        <button class="tab" data-mode="register">Tạo văn phòng mới</button>
      </div>
      <form id="authForm">
        <label>Tên đăng nhập <input name="username" autocomplete="username" required></label>
        <label>Mật khẩu <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <div class="reg-only hidden">
          <label>Tên văn phòng <input name="officeName" placeholder="Ví dụ: Văn phòng Long Phú"></label>
          <label>Tên công ty <input name="companyName" placeholder="Ví dụ: Long Phu Auto"></label>
          <label>Mã mời (nếu chủ hệ thống yêu cầu) <input name="inviteCode"></label>
        </div>
        <button type="submit" class="primary" id="authSubmit">Đăng nhập</button>
        <p class="error" id="authError" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- Văn phòng -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span id="officeName">Văn phòng</span> <span class="muted" id="companyName"></span></div>
      <div class="topinfo">
        <span id="clock">--:--</span>
        <span id="weather" class="muted">Thời tiết TP.HCM: đang tải…</span>
        <span id="sessionState" class="badge">Đã đăng nhập</span>
        <button id="logoutBtn" class="ghost">Đăng xuất</button>
      </div>
    </header>

    <aside class="left" aria-label="Nhân sự theo nhóm">
      <div id="staffGroups"></div>
      <div class="overview" id="overview"></div>
    </aside>

    <main class="center">
      <div id="office3d" role="img" aria-label="Sơ đồ văn phòng 3D: hai dãy bàn nhân viên, Quản lý ngồi giữa phía dưới. Có thể chọn nhân viên ở danh sách bên trái."></div>
      <div class="hint muted">Bấm vào nhân viên trong văn phòng để mở panel riêng. Kéo chuột để xoay, cuộn để phóng to.</div>
    </main>

    <aside class="right">
      <nav class="tabs" id="mainTabs" aria-label="Các khu vực văn phòng">
        <button class="tab active" data-view="staff">Nhân viên</button>
        <button class="tab" data-view="group">Chat nhóm</button>
        <button class="tab" data-view="tasks">Việc</button>
        <button class="tab" data-view="slips">Phiếu bán</button>
        <button class="tab" data-view="zalo">Zalo</button>
        <button class="tab" data-view="reports">Báo cáo</button>
        <button class="tab" data-view="settings">Cài đặt</button>
      </nav>
      <div id="panel" class="panel"></div>
    </aside>
  </section>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
